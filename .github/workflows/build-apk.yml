name: Build Chator Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Build Environment
        run: |
          # Ensure .env exists for Secrets Gradle plugin
          cp .env.example .env 2>/dev/null || touch .env
          # Decode debug keystore if base64 file exists
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          # Ensure gradlew has executable permissions
          chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          echo "Listing generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
